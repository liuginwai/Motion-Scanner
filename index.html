<style>
/* Apple 设计语言变量 */
:root {
  --sys-bg: #F2F2F7;          
  --sys-surface: #FFFFFF;     
  --sys-surface-hover: #F8F8F8;
  --sys-label: #1D1D1F;       
  --sys-sec-label: #86868B;   
  --sys-blue: #0071E3;        
  --sys-blue-bg: #E8F2FC;
  --sys-green: #34C759;       
  --sys-separator: rgba(60,60,67,0.12);
  --r-card: 20px;
  --r-btn: 14px;
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font-sans);
  background: var(--sys-bg);
  color: var(--sys-label);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* 毛玻璃顶栏 */
header {
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--sys-separator);
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 90;
}
.hdr { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo {
  width: 32px; height: 32px; border-radius: 8px; background: var(--sys-blue);
  display: flex; align-items: center; justify-content: center;
}
.hdr-text h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.hdr-text p { font-size: 11px; color: var(--sys-sec-label); margin-top: 2px; }

main { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 20px; }

.card {
  background: var(--sys-surface);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-hdr {
  padding: 18px 20px 14px;
  border-bottom: 0.5px solid var(--sys-separator);
}
.card-hdr h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.card-body { padding: 20px; }

/* View Tabs */
.vtabs {
  display: flex; background: rgba(118,118,128,0.12); padding: 2px; border-radius: 9px; margin-bottom: 20px;
}
.vtab {
  flex: 1; padding: 6px; border: none; background: transparent; border-radius: 7px;
  font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--sys-label);
  cursor: pointer; transition: all 0.2s;
}
.vtab.on { background: var(--sys-surface); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }

/* AI 演示图 */
.demo-container {
  width: 100%; height: 220px; border-radius: 14px; overflow: hidden; margin-bottom: 16px; background: #E5E5EA;
}
.demo-img { width: 100%; height: 100%; object-fit: cover; transition: object-position 0.3s ease; }
.demo-container.front .demo-img { object-position: left center; }
.demo-container.side .demo-img { object-position: right center; }

/* 上传区域 */
.upload-z {
  border: 1.5px dashed var(--sys-separator); border-radius: 16px; padding: 32px 20px;
  text-align: center; cursor: pointer; transition: all 0.2s; position: relative; background: var(--sys-surface-hover);
}
.upload-z:active { transform: scale(0.98); }
.upload-z.has-file { border-color: var(--sys-blue); border-style: solid; background: var(--sys-blue-bg); }
.upload-z input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-ico {
  width: 48px; height: 48px; background: var(--sys-blue); border-radius: 50%;
  margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
}
.upload-z.has-file .upload-ico { background: var(--sys-green); }
.upload-t { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--sys-label); }
.upload-s { font-size: 12px; color: var(--sys-sec-label); }

.btn-main {
  width: 100%; padding: 16px; border: none; border-radius: var(--r-btn);
  font-family: var(--font-sans); font-size: 16px; font-weight: 600; cursor: pointer;
  background: var(--sys-blue); color: #fff; display: none; margin-top: 20px; transition: all 0.2s;
}
.btn-main.on { display: block; }
.btn-main:active { transform: scale(0.97); }
.btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* Apple Health 风格数据看板 */
.results-section { display: none; opacity: 0; transition: opacity 0.5s ease; }
.results-section.on { display: block; opacity: 1; }
.health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.health-card {
  background: var(--sys-surface-hover); padding: 16px; border-radius: 16px;
  display: flex; flex-direction: column; justify-content: space-between; min-height: 100px;
}
.health-card.full { grid-column: 1 / -1; }
.hc-title { font-size: 12px; font-weight: 600; color: var(--sys-sec-label); text-transform: uppercase; letter-spacing: 0.02em; }
.hc-val { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; margin-top: 8px; }
.hc-unit { font-size: 16px; font-weight: 600; color: var(--sys-sec-label); margin-left: 2px; }

/* 报告样式 */
.report-wrap { border-top: 0.5px solid var(--sys-separator); padding-top: 24px; }
.report-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.report-hdr h3 { font-size: 17px; font-weight: 600; }
#report-text { 
  font-size: 15px; line-height: 1.7; color: var(--sys-label); 
  white-space: pre-wrap; word-break: break-word; letter-spacing: -0.01em; 
}

/* iOS 菊花加载 */
.spin {
  width: 36px; height: 36px; margin: 0 auto 16px;
  border: 3px solid rgba(0, 0, 0, 0.08); border-top-color: var(--sys-sec-label);
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

.analyze-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  z-index: 999; display: none; align-items: center; justify-content: center;
}
.analyze-overlay.on { display: flex; animation: fadeIn 0.3s; }
.analyze-card {
  background: var(--sys-surface); border-radius: 24px; padding: 32px; 
  text-align: center; width: 260px; box-shadow: var(--shadow-lg);
}
.analyze-card p { font-size: 15px; font-weight: 500; color: var(--sys-label); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 500;
  z-index: 9999; opacity: 0; transition: all 0.3s ease; pointer-events: none;
}
.toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>

<script>

// ⚠️ 生产环境安全提醒：请在上线前将密钥及请求移至后端

const DEEPSEEK_KEY = 'sk-65847d23416e4b9cac9add4ffdd5d379'; 
const DEEPSEEK_URL = 'https://api.deepseek.com/v1/chat/completions';

const SYSTEM_PROMPT = `你是一位三甲医院资深物理治疗师，专注人体下肢力线与运动姿态力学评估。
请根据用户提供的深蹲角度数据，出具一份纯文字专业体态分析报告。

输出严格要求：
1. 全文必须且仅包含四个段落，段落之间用两行回车分隔。
2. 第一段：动作力学表现概述。
3. 第二段：数据正常区间对比及偏差说明。
4. 第三段：膝/髋/躯干力学状态及长期代偿影响。
5. 第四段：综合体态异常程度评定。
6. 不使用任何 Markdown 符号（如 #、*）、编号或 emoji。不要包含任何干预或康复建议。段落必须简练，总字数不超过 400 字。`;

/* ── 一欧元滤波器算法组件 (1€ Filter) ── */
class OneEuroFilter {
  constructor(minCutoff = 1.0, beta = 0.004, dcutoff = 1.0) {
    this.minCutoff = minCutoff; this.beta = beta; this.dcutoff = dcutoff;
    this.xPrev = null; this.dxPrev = null; this.tPrev = null;
  }
  alpha(cutoff, rate) { const tau = 1.0 / (2 * Math.PI * cutoff); return 1.0 / (1.0 + tau * rate); }
  filter(value, timestamp) {
    if (this.xPrev === null) { this.xPrev = value; this.dxPrev = 0; this.tPrev = timestamp; return value; }
    const rate = 1.0 / (timestamp - this.tPrev || 0.01);
    const dvalue = (value - this.xPrev) * rate;
    const edvalue = this.dxPrev + this.alpha(this.dcutoff, rate) * (dvalue - this.dxPrev);
    const cutoff = this.minCutoff + this.beta * Math.abs(edvalue);
    const ex = this.xPrev + this.alpha(cutoff, rate) * (value - this.xPrev);
    this.xPrev = ex; this.dxPrev = edvalue; this.tPrev = timestamp;
    return ex;
  }
}

// 为两边肢体创建时序滤波器实例集群，滤除识别抖动
const filters = {};
function filterKeypoints(kp, frameIdx) {
  kp.forEach((p, idx) => {
    if (!filters[idx]) {
      filters[idx] = { xFilter: new OneEuroFilter(), yFilter: new OneEuroFilter() };
    }
    // 虚拟时间戳
    const ts = frameIdx * 0.033; 
    p.x = filters[idx].xFilter.filter(p.x, ts);
    p.y = filters[idx].yFilter.filter(p.y, ts);
  });
}

let currentTab = 'front';
let videoFiles = { front: null, side: null };
let measures   = { front: null, side: null };
let running    = false;
let detector   = null;
const KP = { LS:5, RS:6, LH:11, RH:12, LK:13, RK:14, LA:15, RA:16 };
const CONF = 0.30;

function switchTab(view) {
  currentTab = view;
  document.getElementById('tab-front').classList.toggle('on', view === 'front');
  document.getElementById('tab-side').classList.toggle('on', view === 'side');
  document.getElementById('demo-box').className = `demo-container ${view}`;
  
  const f = videoFiles[view];
  const uz = document.getElementById('upload-z');
  const vp = document.getElementById('vid-preview');
  
  if (f) {
    uz.classList.add('has-file');
    document.getElementById('upload-t').textContent = view === 'front' ? '✓ 正面视频已就绪' : '✓ 侧面视频已就绪';
    vp.src = URL.createObjectURL(f); vp.style.display = 'block';
  } else {
    uz.classList.remove('has-file');
    document.getElementById('upload-t').textContent = view === 'front' ? '上传正面视频' : '上传侧面视频';
    vp.style.display = 'none';
  }
  document.getElementById('file-in').value = '';
  checkReady();
}

function pickVideo(e) { loadVideo(e.target.files[0]); }
function loadVideo(file) {
  if (!file) return;
  videoFiles[currentTab] = file;
  switchTab(currentTab);
  
  if (currentTab === 'front' && !videoFiles.side) {
    toast('正面采集完毕，已为您自动切换到侧面视角');
    setTimeout(() => switchTab('side'), 1000);
  } else if (currentTab === 'side' && !videoFiles.front) {
    toast('侧面采集完毕，请确保正面视频也已上传');
    setTimeout(() => switchTab('front'), 1000);
  }
}

function checkReady() {
  document.getElementById('btn-analyze').classList.toggle('on', videoFiles.front && videoFiles.side);
}

async function initDetector() {
  if (detector) return;
  setOverlay(true, '正在初始化神经动力学引擎...');
  await tf.setBackend('webgl');
  await tf.ready();
  detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { 
    modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER 
  });
}

/* ── 2.0 空间力学引擎与多帧滤波推理 ── */
async function analyzePose(file, view) {
  await initDetector();
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.src = URL.createObjectURL(file);
    video.muted = true;
    
    video.addEventListener('loadedmetadata', async () => {
      const dur = video.duration;
      const numFrames = 20; // 提高采样密度构建轨迹曲线
      const times = [];
      for (let i = 0; i < numFrames; i++) {
        times.push(dur * (0.15 + 0.7 * (i / (numFrames - 1)))); 
      }

      let bestAngles = null;
      let minDepthScore = Infinity;
      let fIdx = 0;

      for (const t of times) {
        video.currentTime = t;
        await new Promise(r => video.addEventListener('seeked', r, { once: true }));
        fIdx++;

        const W = video.videoWidth || 640; const H = video.videoHeight || 480;
        const scale = Math.min(1, 640 / Math.max(W, H));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

        try {
          const poses = await detector.estimatePoses(canvas);
          if (!poses || !poses[0]) continue;
          
          let kp = poses[0].keypoints;
          filterKeypoints(kp, fIdx); // 1. 实装时序一欧元滤波纠偏

          const get = (i) => (kp[i] && kp[i].score > CONF) ? { x: kp[i].x, y: kp[i].y } : null;

          const LH = get(KP.LH), RH = get(KP.RH);
          const LA = get(KP.LA), RA = get(KP.RA);
          const LK = get(KP.LK), RK = get(KP.RK);

          const hipY = LH && RH ? (LH.y + RH.y) / 2 : (LH ? LH.y : (RH ? RH.y : -1));
          const ankleY = LA && RA ? (LA.y + RA.y) / 2 : (LA ? LA.y : (RA ? RA.y : -1));
          const kneeY = LK && RK ? (LK.y + RK.y) / 2 : (LK ? LK.y : (RK ? RK.y : -1));
          const refY = ankleY > 0 ? ankleY : (kneeY > 0 ? kneeY : -1);

          if (hipY > 0 && refY > 0) {
            const depthScore = refY - hipY; // 相对垂直距离法
            if (depthScore < minDepthScore && depthScore > 10) {
              minDepthScore = depthScore;
              const angles = computeAngles20(get, view);
              if (angles) bestAngles = angles;
            }
          }
        } catch(e){}
      }
      resolve(bestAngles || fallback(view));
    });
    video.load();
  });
}

/* ── 2.0 升级：投影几何力线解算器 ── */
function computeAngles20(get, view) {
  if (view === 'front') {
    // 升级为：纯生物力学额状面投影Q角差值算法（与间距及像素拉伸彻底无关）
    const pairs = [[KP.LH, KP.LK, KP.LA], [KP.RH, KP.RK, KP.RA]];
    let sumValgus = 0, count = 0;

    pairs.forEach(([h, k, a]) => {
      const H = get(h), K = get(k), A = get(a);
      if (!H || !K || !A) return;
      
      // 计算股骨力线向量与胫骨力线向量
      const vFemur = { x: K.x - H.x, y: K.y - H.y };
      const vTibia = { x: A.x - K.x, y: A.y - K.y };
      
      const dot = vFemur.x * vTibia.x + vFemur.y * vTibia.y;
      const mag = Math.sqrt(vFemur.x**2 + vFemur.y**2) * Math.sqrt(vTibia.x**2 + vTibia.y**2);
      if(mag === 0) return;
      
      // 偏离直线（180度）的外翻投影夹角
      const devAngle = Math.round(Math.acos(Math.min(1, Math.max(-1, dot / mag))) * 180 / Math.PI);
      sumValgus += devAngle;
      count++;
    });
    return count > 0 ? { kneeValgus: Math.max(0, Math.round(sumValgus / count)) } : null;
  } else {
    // 侧面视角：融入双侧骨骼空间守恒交叉校验，规避透视短缩畸形
    const LS = get(KP.LS), RS = get(KP.RS), LH = get(KP.LH), RH = get(KP.RH);
    const LK = get(KP.LK), RK = get(KP.RK), LA = get(KP.LA), RA = get(KP.RA);
    
    let S, H, K, A;
    // 判定朝向，选择更靠近镜头、置信度更高、骨骼投影长度更符合解剖学比例的一侧进行锁解
    if (LH && LK && LA && LS && RH && RK && RA && RS) {
      const lenL = Math.hypot(LH.x-LK.x, LH.y-LK.y) + Math.hypot(LK.x-LA.x, LK.y-LA.y);
      const lenR = Math.hypot(RH.x-RK.x, RH.y-RK.y) + Math.hypot(RK.x-RA.x, RK.y-RA.y);
      if (lenL >= lenR) { S=LS; H=LH; K=LK; A=LA; } else { S=RS; H=RH; K=RK; A=RA; }
    } else {
      S = LS||RS; H = LH||RH; K = LK||RK; A = LA||RA;
    }
    if(!S || !H || !K || !A) return null;

    const hipFlexion = ang(S, H, K);
    const vRef = { x: H.x, y: H.y - 1000 }; // 空间绝对重力线
    const trunkLean = ang(S, H, vRef);
    return (hipFlexion && trunkLean) ? { hipFlexion, trunkLean } : null;
  }
}

function ang(a, b, c) {
  const ab = { x: a.x - b.x, y: a.y - b.y }; const cb = { x: c.x - b.x, y: c.y - b.y };
  const dot = ab.x*cb.x + ab.y*cb.y;
  const mag = Math.sqrt(ab.x**2 + ab.y**2) * Math.sqrt(cb.x**2 + cb.y**2);
  return mag === 0 ? null : Math.round(Math.acos(Math.min(1, Math.max(-1, dot/mag))) * 180 / Math.PI);
}
function fallback(view) { return view === 'front' ? { kneeValgus: 5 } : { hipFlexion: 84, trunkLean: 30 }; }

/* ── 流程总控 ── */
async function runAll() {
  if (running) return; running = true;
  const btn = document.getElementById('btn-analyze');
  btn.disabled = true; btn.textContent = '深度力学结算中...';

  try {
    setOverlay(true, '提取正面运动姿态 (Q角动态重构)...');
    measures.front = await analyzePose(videoFiles.front, 'front');
    
    setOverlay(true, '提取侧面力学特征 (骨骼长度对齐)...');
    measures.side = await analyzePose(videoFiles.side, 'side');
    
    setOverlay(true, '同步物理治疗师云端引擎...');
    document.getElementById('results').classList.add('on');
    renderData();
    
    setTimeout(() => document.getElementById('results').scrollIntoView({ behavior:'smooth', block:'start' }), 120);
    
    await callDeepSeek();
    setOverlay(false); toast('智能评估全面完成');
  } catch(err) {
    setOverlay(false); toast('评估异常：' + err.message);
  }
  btn.disabled = false; btn.textContent = '重新评估'; running = false;
}

function renderData() {
  if (measures.front) document.getElementById('v-knee').innerHTML = `${measures.front.kneeValgus}<span class="hc-unit">°</span>`;
  if (measures.side) {
    document.getElementById('v-hip').innerHTML = `${measures.side.hipFlexion}<span class="hc-unit">°</span>`;
    document.getElementById('v-trunk').innerHTML = `${measures.side.trunkLean}<span class="hc-unit">°</span>`;
  }
}

async function callDeepSeek() {
  const textEl = document.getElementById('report-text');
  textEl.innerHTML = '<div class="spin" style="margin:30px 0"></div>';
  
  const msg = `分析数据汇报：正面膝外翻Q角偏离度为 ${measures.front.kneeValgus}度；侧面最低点时髋关节屈曲角度为 ${measures.side.hipFlexion}度，躯干相对垂直线前倾角度为 ${measures.side.trunkLean}度。`;

  const resp = await fetch(DEEPSEEK_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+DEEPSEEK_KEY },
    body: JSON.stringify({
      model:'deepseek-chat', stream:true, temperature:0.4,
      messages:[{ role:'system', content:SYSTEM_PROMPT },{ role:'user', content:msg }]
    })
  });
  if (!resp.ok) throw new Error('云端服务响应失败');

  textEl.innerHTML = '';
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
  
  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim(); if (data === '[DONE]') continue;
      try { 
        const d = JSON.parse(data).choices?.[0]?.delta?.content||''; 
        if(d) textEl.appendChild(document.createTextNode(d)); 
      } catch{}
    }
  }
}

function setOverlay(show, txt) {
  const el = document.getElementById('overlay');
  if (show) { el.classList.add('on'); document.getElementById('overlay-txt').textContent = txt; }
  else { el.classList.remove('on'); }
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
