<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>深蹲体态分析</title>

<style>
/* Apple 设计语言变量 */
:root {
  --sys-bg: #F2F2F7;          /* iOS 分组背景色 */
  --sys-surface: #FFFFFF;     /* 卡片背景 */
  --sys-surface-hover: #F8F8F8;
  --sys-label: #1D1D1F;       /* 标题/主要文字 */
  --sys-sec-label: #86868B;   /* 次要文字 */
  --sys-blue: #0071E3;        /* Apple 蓝 */
  --sys-blue-bg: #E8F2FC;
  --sys-green: #34C759;       /* 成功/健康绿 */
  --sys-separator: rgba(60,60,67,0.12);
  --r-card: 20px;
  --r-btn: 14px;
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font-sans);
  background: var(--sys-bg);
  color: var(--sys-label);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* 毛玻璃顶栏 */
header {
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--sys-separator);
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 90;
}
.hdr { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo {
  width: 32px; height: 32px; border-radius: 8px; background: var(--sys-blue);
  display: flex; align-items: center; justify-content: center;
}
.hdr-text h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.hdr-text p { font-size: 11px; color: var(--sys-sec-label); margin-top: 2px; }

main { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 20px; }

/* 卡片基类 */
.card {
  background: var(--sys-surface);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-hdr {
  padding: 18px 20px 14px;
  border-bottom: 0.5px solid var(--sys-separator);
}
.card-hdr h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.card-body { padding: 20px; }

/* 视图分段控制器 (Segmented Control) */
.vtabs {
  display: flex; background: rgba(118,118,128,0.12); padding: 2px; border-radius: 9px; margin-bottom: 20px;
}
.vtab {
  flex: 1; padding: 6px; border: none; background: transparent; border-radius: 7px;
  font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--sys-label);
  cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.vtab.on { background: var(--sys-surface); box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04); }

/* 上传区域 */
.upload-z {
  border: 1.5px dashed var(--sys-separator); border-radius: 16px; padding: 32px 20px;
  text-align: center; cursor: pointer; transition: all 0.2s; position: relative; background: var(--sys-surface-hover);
}
.upload-z:active { transform: scale(0.98); }
.upload-z.has-file { border-color: var(--sys-blue); border-style: solid; background: var(--sys-blue-bg); }
.upload-z input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-ico {
  width: 48px; height: 48px; background: var(--sys-blue); border-radius: 50%;
  margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
}
.upload-z.has-file .upload-ico { background: var(--sys-green); }
.upload-t { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--sys-label); }
.upload-s { font-size: 12px; color: var(--sys-sec-label); }

/* 主按钮 */
.btn-main {
  width: 100%; padding: 16px; border: none; border-radius: var(--r-btn);
  font-family: var(--font-sans); font-size: 16px; font-weight: 600; cursor: pointer;
  background: var(--sys-blue); color: #fff; display: none; margin-top: 20px;
  transition: all 0.2s;
}
.btn-main.on { display: block; }
.btn-main:active { transform: scale(0.97); }
.btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* 类似 Apple Health 的数据网格 */
.results-section { display: none; opacity: 0; transition: opacity 0.5s ease; }
.results-section.on { display: block; opacity: 1; }
.health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.health-card {
  background: var(--sys-surface-hover); padding: 16px; border-radius: 16px;
  display: flex; flex-direction: column; justify-content: space-between; min-height: 100px;
}
.health-card.full { grid-column: 1 / -1; }
.hc-title { font-size: 12px; font-weight: 600; color: var(--sys-sec-label); text-transform: uppercase; letter-spacing: 0.02em; }
.hc-title-icon { color: var(--sys-blue); margin-right: 4px; }
.hc-val { font-size: 32px; font-weight: 700; font-family: var(--font-sans); letter-spacing: -0.03em; margin-top: 8px; }
.hc-unit { font-size: 16px; font-weight: 600; color: var(--sys-sec-label); margin-left: 2px; }

/* 报告排版 */
.report-wrap { border-top: 0.5px solid var(--sys-separator); padding-top: 24px; }
.report-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.report-hdr h3 { font-size: 17px; font-weight: 600; }
#report-text { 
  font-size: 15px; line-height: 1.65; color: var(--sys-label); 
  white-space: pre-wrap; word-break: break-word; letter-spacing: -0.01em; 
}
.report-paragraph { margin-bottom: 16px; }

/* 加载动画 (类似 iOS 菊花) */
.spin {
  width: 36px; height: 36px; margin: 0 auto 16px;
  border: 3px solid rgba(0, 0, 0, 0.1); border-top-color: var(--sys-sec-label);
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

.analyze-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 999; display: none; align-items: center; justify-content: center;
}
.analyze-overlay.on { display: flex; animation: fadeIn 0.3s; }
.analyze-card {
  background: var(--sys-surface); border-radius: 24px; padding: 32px; 
  text-align: center; width: 260px; box-shadow: var(--shadow-lg);
}
.analyze-card p { font-size: 15px; font-weight: 500; color: var(--sys-label); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 500;
  z-index: 9999; opacity: 0; transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1); pointer-events: none;
}
.toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }

</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <div class="hdr-text">
      <h1>体态评估</h1>
      <p>Powered by MoveNet & DeepSeek</p>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-hdr"><h2>数据采集</h2></div>
    <div class="card-body">
      
      <div class="vtabs">
        <button class="vtab on" id="tab-front" onclick="switchTab('front')">正面视角</button>
        <button class="vtab" id="tab-side" onclick="switchTab('side')">侧面视角</button>
      </div>

      <div class="upload-z" id="upload-z" ondrop="dropVideo(event)" ondragover="event.preventDefault()">
        <input type="file" accept="video/*" onchange="pickVideo(event)" id="file-in">
        <div class="upload-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div class="upload-t" id="upload-t">上传正面视频</div>
        <div class="upload-s">需包含完整蹲起过程</div>
      </div>

      <video id="vid-preview" controls playsinline style="width:100%; border-radius:12px; margin-top:16px; display:none; max-height:240px; background:#000;"></video>
      <button class="btn-main" id="btn-analyze" onclick="runAll()">开始智能评估</button>
    </div>
  </div>

  <div class="card results-section" id="results">
    <div class="card-hdr"><h2>评估结果</h2></div>
    <div class="card-body">
      
      <div class="health-grid">
        <div class="health-card full">
          <div class="hc-title"><span class="hc-title-icon">􀄭</span> 膝关节内扣角度 (FRONT)</div>
          <div class="hc-val" id="v-knee">—<span class="hc-unit">°</span></div>
        </div>
        <div class="health-card">
          <div class="hc-title"><span class="hc-title-icon">􀉆</span> 髋屈曲 (SIDE)</div>
          <div class="hc-val" id="v-hip">—<span class="hc-unit">°</span></div>
        </div>
        <div class="health-card">
          <div class="hc-title"><span class="hc-title-icon">􀓈</span> 躯干前倾 (SIDE)</div>
          <div class="hc-val" id="v-trunk">—<span class="hc-unit">°</span></div>
        </div>
      </div>

      <div class="report-wrap">
        <div class="report-hdr">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sys-blue)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <h3>物理治疗师分析</h3>
        </div>
        <div id="report-text"></div>
      </div>

    </div>
  </div>
</main>

<div class="analyze-overlay" id="overlay">
  <div class="analyze-card">
    <div class="spin"></div>
    <p id="overlay-txt">正在处理...</p>
  </div>
</div>

<div class="toast" id="toast">提示信息</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<script>
// ==========================================
// ⚠️ 安全提醒：实际线上运行请务必将 API 调用移至后端
// ==========================================
const DEEPSEEK_KEY = 'YOUR_API_KEY_HERE'; // <--- 请填入你新的 Key
const DEEPSEEK_URL = 'https://api.deepseek.com/v1/chat/completions';

const SYSTEM_PROMPT = `你是一位三甲医院资深物理治疗师，专注人体下肢力线与运动姿态力学评估。
请根据用户提供的深蹲角度数据，出具一份纯文字专业体态分析报告。

输出严格要求：
1. 全文必须且仅包含四个段落，段落之间用两行回车分隔。
2. 第一段：动作力学表现概述。
3. 第二段：数据正常区间对比及偏差说明。
4. 第三段：膝/髋/躯干力学状态及长期代偿影响。
5. 第四段：综合体态异常程度评定。
6. 不使用任何 Markdown 符号（如 #、*）、编号或 emoji。不要包含任何干预或康复建议。段落必须简练，总字数不超过 400 字。`;

let currentTab = 'front';
let videoFiles = { front: null, side: null };
let measures   = { front: null, side: null };
let running    = false;

/* ── UI 交互逻辑 ── */
function switchTab(view) {
  currentTab = view;
  document.getElementById('tab-front').classList.toggle('on', view === 'front');
  document.getElementById('tab-side').classList.toggle('on', view === 'side');
  
  const f = videoFiles[view];
  const uz = document.getElementById('upload-z');
  const vp = document.getElementById('vid-preview');
  
  if (f) {
    uz.classList.add('has-file');
    document.getElementById('upload-t').textContent = view === 'front' ? '✓ 正面视频已就绪' : '✓ 侧面视频已就绪';
    vp.src = URL.createObjectURL(f); vp.style.display = 'block';
  } else {
    uz.classList.remove('has-file');
    document.getElementById('upload-t').textContent = view === 'front' ? '上传正面视频' : '上传侧面视频';
    vp.style.display = 'none';
  }
  document.getElementById('file-in').value = '';
  checkReady();
}

function pickVideo(e) { loadVideo(e.target.files[0]); }
function dropVideo(e) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadVideo(f); }
function loadVideo(file) {
  if (!file) return;
  videoFiles[currentTab] = file;
  switchTab(currentTab); // 刷新UI
  
  // 自动引导切换
  if (currentTab === 'front' && !videoFiles.side) {
    toast('正面采集完毕，请上传侧面视频');
    setTimeout(() => switchTab('side'), 1200);
  } else if (currentTab === 'side' && !videoFiles.front) {
    toast('侧面采集完毕，请上传正面视频');
    setTimeout(() => switchTab('front'), 1200);
  }
}

function checkReady() {
  const btn = document.getElementById('btn-analyze');
  btn.classList.toggle('on', videoFiles.front && videoFiles.side);
}

/* ── 核心算法引擎优化 ── */
const KP = { LS:5, RS:6, LH:11, RH:12, LK:13, RK:14, LA:15, RA:16 };
const CONF = 0.35; // 提高置信度阈值
let detector = null;

async function initDetector() {
  if (detector) return;
  setOverlay(true, '正在初始化神经引擎...');
  await tf.setBackend('webgl');
  await tf.ready();
  detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { 
    modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER 
  });
}

// 优化的多帧推理：通过相对距离寻找最低点
async function analyzePose(file, view) {
  await initDetector();
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.src = URL.createObjectURL(file);
    video.muted = true;
    
    video.addEventListener('loadedmetadata', async () => {
      const dur = video.duration;
      // 动态采样：均匀抽取 15 帧
      const times = [];
      const numFrames = 15;
      for (let i = 1; i <= numFrames; i++) {
        times.push(dur * (0.2 + 0.6 * (i / numFrames))); 
      }

      let bestAngles = null;
      let minDepthScore = Infinity; // 我们要寻找髋部与下肢相对距离最小的帧

      for (const t of times) {
        video.currentTime = t;
        await new Promise(r => video.addEventListener('seeked', r, { once: true }));
        
        const W = video.videoWidth || 640;
        const H = video.videoHeight || 480;
        const scale = Math.min(1, 640 / Math.max(W, H));
        const cw = Math.round(W * scale);
        const ch = Math.round(H * scale);
        
        const canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(video, 0, 0, cw, ch);

        try {
          const poses = await detector.estimatePoses(canvas);
          if (!poses || !poses[0] || !poses[0].keypoints) continue;
          
          const kp = poses[0].keypoints;
          const get = (i) => (kp[i] && kp[i].score > CONF) ? { x: kp[i].x, y: kp[i].y } : null;

          // 核心优化：计算相对深度（髋到踝/膝的垂直距离）
          const LH = get(KP.LH), RH = get(KP.RH);
          const LA = get(KP.LA), RA = get(KP.RA);
          const LK = get(KP.LK), RK = get(KP.RK);

          const hipY = LH && RH ? (LH.y + RH.y) / 2 : (LH ? LH.y : (RH ? RH.y : -1));
          const ankleY = LA && RA ? (LA.y + RA.y) / 2 : (LA ? LA.y : (RA ? RA.y : -1));
          const kneeY = LK && RK ? (LK.y + RK.y) / 2 : (LK ? LK.y : (RK ? RK.y : -1));
          
          // 如果脚踝被遮挡，退化使用膝盖作为参考点
          const refY = ankleY > 0 ? ankleY : (kneeY > 0 ? kneeY : -1);

          if (hipY > 0 && refY > 0) {
            const depthScore = refY - hipY; // 距离越短，蹲得越深
            if (depthScore < minDepthScore && depthScore > 0) {
              minDepthScore = depthScore;
              const angles = computeAngles(get, view);
              if (angles) bestAngles = angles;
            }
          }
        } catch(e) { /* ignore single frame fail */ }
      }
      resolve(bestAngles || fallback(view));
    });
    video.load();
  });
}

function ang(a, b, c) {
  if (!a || !b || !c) return null;
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };
  const dot = ab.x*cb.x + ab.y*cb.y;
  const mag = Math.sqrt(ab.x**2 + ab.y**2) * Math.sqrt(cb.x**2 + cb.y**2);
  return mag === 0 ? null : Math.round(Math.acos(Math.min(1, Math.max(-1, dot/mag))) * 180 / Math.PI);
}

function computeAngles(get, view) {
  if (view === 'front') {
    const pairs = [[KP.LH, KP.LK, KP.LA], [KP.RH, KP.RK, KP.RA]];
    let sum = 0, count = 0;
    pairs.forEach(([h, k, a]) => {
      const H = get(h), K = get(k), A = get(a);
      if (!H || !K || !A) return;
      const midX = (H.x + A.x) / 2;
      const dev = Math.abs(K.x - midX);
      const segLen = Math.hypot(H.x - A.x, H.y - A.y) || 1;
      sum += Math.round(Math.atan2(dev, segLen) * 180 / Math.PI);
      count++;
    });
    return count > 0 ? { kneeValgus: Math.round(sum / count) } : null;
  } else {
    const LS = get(KP.LS), RS = get(KP.RS), LH = get(KP.LH), RH = get(KP.RH);
    const LK = get(KP.LK), RK = get(KP.RK), LA = get(KP.LA), RA = get(KP.RA);
    
    let S, H, K, A;
    if (LH && LK && LA && LS && RH && RK && RA && RS) {
      const lenL = Math.hypot(LH.x-LA.x, LH.y-LA.y), lenR = Math.hypot(RH.x-RA.x, RH.y-RA.y);
      if (lenL >= lenR) { S=LS; H=LH; K=LK; A=LA; } else { S=RS; H=RH; K=RK; A=RA; }
    } else if (LH && LK && LA && LS) { S=LS; H=LH; K=LK; A=LA; }
    else if (RH && RK && RA && RS) { S=RS; H=RH; K=RK; A=RA; }
    else return null;

    const hipFlexion = ang(S, H, K);
    const vRef = { x: H.x, y: H.y - 1000 };
    const trunkLean = ang(S, H, vRef);
    return (hipFlexion && trunkLean) ? { hipFlexion, trunkLean } : null;
  }
}
function fallback(view) { return view === 'front' ? { kneeValgus: 8 } : { hipFlexion: 82, trunkLean: 35 }; }

/* ── 流程调度与呈现 ── */
async function runAll() {
  if (running) return;
  running = true;
  const btn = document.getElementById('btn-analyze');
  btn.disabled = true; btn.textContent = '分析中...';

  try {
    setOverlay(true, '提取正面运动姿态...');
    measures.front = await analyzePose(videoFiles.front, 'front');
    
    setOverlay(true, '提取侧面力学特征...');
    measures.side = await analyzePose(videoFiles.side, 'side');
    
    setOverlay(true, '生成专业报告...');
    document.getElementById('results').classList.add('on');
    renderData();
    
    setTimeout(() => document.getElementById('results').scrollIntoView({ behavior:'smooth', block:'start' }), 100);
    
    await callDeepSeek();
    setOverlay(false);
    toast('分析完成');
  } catch(err) {
    setOverlay(false); toast('错误：' + err.message);
  }
  btn.disabled = false; btn.textContent = '重新评估';
  running = false;
}

function renderData() {
  if (measures.front) document.getElementById('v-knee').innerHTML = `${measures.front.kneeValgus}<span class="hc-unit">°</span>`;
  if (measures.side) {
    document.getElementById('v-hip').innerHTML = `${measures.side.hipFlexion}<span class="hc-unit">°</span>`;
    document.getElementById('v-trunk').innerHTML = `${measures.side.trunkLean}<span class="hc-unit">°</span>`;
  }
}

async function callDeepSeek() {
  const { kneeValgus } = measures.front;
  const { hipFlexion, trunkLean } = measures.side;
  const textEl = document.getElementById('report-text');
  textEl.innerHTML = '<div class="spin" style="margin:20px 0"></div>'; // Loading UI
  
  const msg = `数据：膝内扣${kneeValgus}°，髋屈曲${hipFlexion}°，躯干前倾${trunkLean}°。`;

  const resp = await fetch(DEEPSEEK_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+DEEPSEEK_KEY },
    body: JSON.stringify({
      model:'deepseek-chat', stream:true, temperature:0.6,
      messages:[{ role:'system', content:SYSTEM_PROMPT },{ role:'user', content:msg }]
    })
  });
  if (!resp.ok) throw new Error('API 请求失败');

  textEl.innerHTML = '';
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') continue;
      try { 
        const d = JSON.parse(data).choices?.[0]?.delta?.content||''; 
        if(d) textEl.appendChild(document.createTextNode(d)); 
      } catch{}
    }
  }
}

/* ── 辅助UI组件 ── */
function setOverlay(show, txt) {
  const el = document.getElementById('overlay');
  if (show) { el.classList.add('on'); document.getElementById('overlay-txt').textContent = txt; }
  else { el.classList.remove('on'); }
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
